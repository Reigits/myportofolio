<p class="experience-status">
    <button type="button"
            class="button"
            popovertarget="add-project"
            aria-label="Tambah Proyek"
            title="Tambah proyek">
        + Tambah Proyek
    </button>
</p>
<div id="add-project"
    class="popover-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="tambah proyek">
    <button type="button"
            class="popover-modal__backdrop"
            popovertarget="add-project"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi tambah"></button>
    <div class="popover-modal__content">
        <h1>Add New Projects</h1>
        <form method="post"
              action="{% url 'main:show_projects' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="button">Tambah Project</button>
            <button type="button" 
                    class="button button-secondary" 
                    popovertarget="add-project" 
                    popovertargetaction="hide">
                Batal
            </button>
        </form>
    </div>
</div>
