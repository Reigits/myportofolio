<p class="experience-status">
<button type="button"
        class="button"
        popovertarget="add-education"
        aria-label="Tambah Pendidikan"
        title="Tambah Pendidikan">
    + Tambah Pendidikan
</button>
</p>

<div id="add-education"
 class="popover-modal"
 popover="auto"
 role="dialog"
 aria-modal="true"
 aria-labelledby="add-education-title">
<button type="button"
        class="popover-modal__backdrop"
        popovertarget="add-education"
        popovertargetaction="hide"
        aria-label="Tutup form tambah pendidikan"></button>
<div class="popover-modal__content">
    <button type="button"
            class="popover-modal__close"
            popovertarget="add-education"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pendidikan"></button>
    <h1 id="add-education-title">Tambah Riwayat Pendidikan</h1>
    <form method="post" action="{% url 'main:show_main' %}" class="project-form">
        {% csrf_token %}
        <input type="hidden" name="form_type" value="education">
        {% for field in edu_form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
        <div class="popover-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="add-education"
                    popovertargetaction="hide">
                Batal
            </button>
            <button type="submit" class="button">Tambah Pendidikan</button>
        </div>
    </form>
</div>
</div>
