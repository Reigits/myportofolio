<button type="button"
        class="button button-danger small"
        popovertarget="delete-edu-{{ edu.id }}"
        aria-label="Hapus {{ edu.title }}"
        title="Hapus edukasi">
    Hapus Edukasi
</button>
<div id="delete-edu-{{ edu.id }}"
     class="popover-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-edu-title-{{ edu.id }}">
    <button type="button"
            class="popover-modal__backdrop"
            popovertarget="delete-edu-{{ edu.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="popover-modal__content">
        <button type="button"
                class="popover-modal__close"
                popovertarget="delete-edu-{{ edu.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-edu-title-{{ edu.id }}">Hapus Edukasi?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ edu.title }}</strong>?
        </p>
        <div class="popover-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-edu-{{ edu.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_edu' edu.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
