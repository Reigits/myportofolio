<div id="{{modal_id}}"
     class="popover-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-{{model_name}}-title">
    <button type="button"
            class="popover-modal__backdrop"
            popovertarget="{{modal_id}}"
            popovertargetaction="hide"
            aria-label="Tutup form tambah {{model_name}}"></button>
    <div class="popover-modal__content">
        <button type="button"
                class="popover-modal__close"
                popovertarget="{{modal_id}}"
                popovertargetaction="hide"
                aria-label="Tutup form tambah {{model_name}}"></button>
        <h1 id="add-{{model_name}}-title">Tambah {{model_title}}</h1>
        <form method="post" action="{{action_url}}" class="project-form">
            {% csrf_token %}
            {% if form_type %}
            <input type="hidden" name="form_type" value="{{form_type}}">
            {% endif %}
            {% for field in target_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="popover-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="{{modal_id}}"
                        popovertargetaction="hide">
                    Batal
                </button>
                <button type="submit" class="button">Tambah {{model_title}}</button>
            </div>
        </form>
</div>
</div>
