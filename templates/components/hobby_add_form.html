<p class="experience-status">
    <button type="button"
            class="button"
            popovertarget="add-hobby"
            aria-label="Tambah Hobi"
            title="Tambah Hobi">
        + Tambah Hobi
    </button>
</p>

<div id="add-hobby"
     class="popover-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-hobby-title">
    <button type="button"
            class="popover-modal__backdrop"
            popovertarget="add-hobby"
            popovertargetaction="hide"
            aria-label="Tutup form tambah hobi"></button>
    <div class="popover-modal__content">
        <button type="button"
                class="popover-modal__close"
                popovertarget="add-hobby"
                popovertargetaction="hide"
                aria-label="Tutup form tambah hobi"></button>
        <h1 id="add-hobby-title">Tambah Hobi</h1>
        <form method="post" action="{% url 'main:show_main' %}" class="project-form">
            {% csrf_token %}
            <input type="hidden" name="form_type" value="hobby">
            {% for field in hobby_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="popover-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-hobby"
                        popovertargetaction="hide">
                    Batal
                </button>
                <button type="submit" class="button">Tambah Hobi</button>
            </div>
        </form>
    </div>
</div>
